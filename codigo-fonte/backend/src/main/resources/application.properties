spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:amicats}
spring.datasource.username=${DB_USER:amicats}
spring.datasource.password=${DB_PASSWORD:amicats}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.rate-limit.sensitive.capacity=${RATE_LIMIT_SENSITIVE_CAPACITY:5}
app.rate-limit.sensitive.refill-minutes=${RATE_LIMIT_SENSITIVE_REFILL_MINUTES:1}
app.rate-limit.default.capacity=${RATE_LIMIT_DEFAULT_CAPACITY:60}
app.rate-limit.default.refill-minutes=${RATE_LIMIT_DEFAULT_REFILL_MINUTES:1}

jwt.secret=${JWT_SECRET}

spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:contato@ongamicats.com.br}
