<div class="change-password-page">
  <div class="change-password-card">
    <div class="change-password-card__header">
      <div class="change-password-card__icon">
        <svg width="22" height="22" viewBox="0 0 24 24">
          <rect
            x="5"
            y="11"
            width="14"
            height="9"
            rx="2"
            fill="none"
            stroke="var(--color-sage-50)"
            stroke-width="1.6"
          />
          <path
            d="M8 11V8a4 4 0 018 0v3"
            fill="none"
            stroke="var(--color-sage-50)"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <circle cx="12" cy="15.2" r="1.3" fill="var(--color-sage-50)" />
        </svg>
      </div>
      <h1>Defina sua nova senha</h1>
      <p>
        Por segurança, você precisa criar uma nova senha antes de continuar.
      </p>
    </div>

    @if (errorMessage()) {
      <div class="change-password-card__error" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="change-password-card__form"
    >
      <app-text-field
        inputId="currentPassword"
        label="Senha atual (temporária)"
        type="password"
        autocomplete="current-password"
        [control]="form.controls.currentPassword"
        [errorMessages]="currentPasswordErrorMessages"
      />
      <app-text-field
        inputId="newPassword"
        label="Nova senha"
        type="password"
        autocomplete="new-password"
        [control]="form.controls.newPassword"
        [errorMessages]="newPasswordErrorMessages"
      />
      <app-text-field
        inputId="confirmNewPassword"
        label="Confirmar nova senha"
        type="password"
        autocomplete="new-password"
        [control]="form.controls.confirmNewPassword"
        [errorMessages]="confirmNewPasswordErrorMessages"
      />

      <app-submit-button
        label="Salvar e continuar"
        loadingLabel="Salvando..."
        [loading]="loading()"
      />
    </form>
  </div>
</div>
