<div class="page">
  <header class="page-header">
    <a
      routerLink="/stock"
      class="page-header__back"
      aria-label="Voltar para estoque"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </a>

    <a routerLink="/stock" class="page-header__crumb">
      Estoque
    </a>

    <span class="page-header__separator">/</span>

    <h1>Editar item</h1>
  </header>

  @if (loadError()) {
  <div class="feedback feedback--error" role="alert">
    {{ loadError() }}
  </div>
  } @else if (loading()) {
  <div class="feedback">
    Carregando item...
  </div>
  } @else if (item()) {
  <form
    class="form-card"
    [formGroup]="form"
    (ngSubmit)="save()"
    novalidate
  >
    @if (saveError()) {
    <div class="feedback feedback--error" role="alert">
      {{ saveError() }}
    </div>
    }

    <app-text-field
      inputId="name"
      label="Medicamento"
      [control]="form.controls.name"
      [errorMessages]="errors.name"
    />

    <div class="field">
      <label for="category">Categoria</label>

      <select
        id="category"
        formControlName="category"
        [class.field__input--invalid]="
            form.controls.category.invalid &&
            form.controls.category.touched
          "
      >
        <option value="" disabled>
          Selecione uma categoria
        </option>

        @for (category of stockCategories; track category) {
        <option [value]="category">
          {{ category }}
        </option>
        }
      </select>

      @if (
      form.controls.category.invalid &&
      form.controls.category.touched
      ) {
      <span class="field-error">
            Informe a categoria.
          </span>
      }
    </div>

    <app-text-field
      inputId="unit"
      label="Unidade"
      placeholder="Ex.: unidades, ml, frascos"
      [control]="form.controls.unit"
      [errorMessages]="errors.unit"
    />

    <div class="field">
      <label for="notes">Observações</label>

      <textarea
        id="notes"
        rows="3"
        formControlName="notes"
      ></textarea>
    </div>

    <div class="form-actions">
      <a
        routerLink="/stock"
        class="cancel-button"
      >
        Cancelar
      </a>

      <div class="form-actions__submit">
        <app-submit-button
          label="Salvar alterações"
          loadingLabel="Salvando..."
          [loading]="saving()"
        />
      </div>
    </div>
  </form>
  }
</div>
