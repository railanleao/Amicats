<span
  class="avatar"
  aria-hidden="true"
  [style.width.px]="size"
  [style.height.px]="size"
  [style.fontSize.px]="size * 0.36"
>
  @if (previewUrl) {
    <img [src]="previewUrl" alt=""/>
  } @else {
    @if (photoUrl(); as url) {
      <img [src]="url" alt=""/>
    } @else {
      {{ initials }}
    }
  }
</span>
