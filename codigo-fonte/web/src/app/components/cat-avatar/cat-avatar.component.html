<span
  class="avatar"
  aria-hidden="true"
  [style.width.px]="size"
  [style.height.px]="size"
  [style.fontSize.px]="size * 0.36"
>
  @if (previewUrl) {
    <img [src]="previewUrl" alt="" />
  } @else if (photoUrl()) {
    <img [src]="photoUrl()" alt="" />
  } @else {
    {{ initials }}
  }
</span>
