services:
  postgres:
    image: postgres:16-alpine
    container_name: amicats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-amicats}
      POSTGRES_USER: ${DB_USER:-amicats}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-amicats}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-amicats} -d ${DB_NAME:-amicats}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./codigo-fonte/backend
    container_name: amicats-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-amicats}
      DB_USER: ${DB_USER:-amicats}
      DB_PASSWORD: ${DB_PASSWORD:-amicats}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./codigo-fonte/web
    container_name: amicats-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
