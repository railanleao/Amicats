services:
  postgres:
    image: postgres:16-alpine
    container_name: amicats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-amicats}
      POSTGRES_USER: ${DB_USER:-amicats}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-amicats}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-amicats} -d ${DB_NAME:-amicats}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: amicats-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-amicats}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-amicats123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./codigo-fonte/backend
    container_name: amicats-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-amicats}
      DB_USER: ${DB_USER:-amicats}
      DB_PASSWORD: ${DB_PASSWORD:-amicats}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      RATE_LIMIT_SENSITIVE_CAPACITY: ${RATE_LIMIT_SENSITIVE_CAPACITY:-5}
      RATE_LIMIT_SENSITIVE_REFILL_MINUTES: ${RATE_LIMIT_SENSITIVE_REFILL_MINUTES:-1}
      RATE_LIMIT_DEFAULT_CAPACITY: ${RATE_LIMIT_DEFAULT_CAPACITY:-60}
      RATE_LIMIT_DEFAULT_REFILL_MINUTES: ${RATE_LIMIT_DEFAULT_REFILL_MINUTES:-1}
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-contato@ongamicats.com.br}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-amicats}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-amicats123}
      MINIO_BUCKET: ${MINIO_BUCKET:-amicats-photos}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./codigo-fonte/web
    container_name: amicats-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
